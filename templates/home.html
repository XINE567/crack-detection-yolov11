<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    <title>系统首页</title>
    <style>
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            margin: 30px;
            background-color: #f5f7fa;
        }

        .nav {
            text-align: right;
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-top: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .number {
            font-size: 30px;
            font-weight: bold;
            color: #2f6fed;
        }

        .menu {
            margin-top: 35px;
            text-align: center;
        }

        .menu a {
            display: inline-block;
            margin: 10px;
            padding: 12px 25px;
            background: #2f6fed;
            color: white;
            border-radius: 5px;
            text-decoration: none;
        }

        .menu a:hover {
            opacity: 0.9;
        }

        .flow-section {
            margin-top: 30px;
            background: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .flow-title {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .flow {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .flow-item {
            flex: 1;
            background: linear-gradient(180deg, #f5f9ff, #eaf2ff);
            border: 1px solid #cfe0ff;
            color: #2f6fed;
            text-align: center;
            padding: 16px 8px;
            border-radius: 10px;
            font-weight: bold;
            line-height: 1.5;
        }

        .flow-arrow {
            color: #999;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="nav">
    当前用户：{{ username }} |
    <a href="/logout">退出登录</a>
</div>

<h1>建筑表面裂纹智能巡检系统</h1>

<div class="flow-section">
    <div class="flow-title">系统完整工作流程</div>

    <div class="flow">
        <div class="flow-item">小车巡检</div>
        <div class="flow-arrow">→</div>
        <div class="flow-item">树莓派<br>图像采集</div>
        <div class="flow-arrow">→</div>
        <div class="flow-item">RK3588<br>YOLO检测</div>
        <div class="flow-arrow">→</div>
        <div class="flow-item">PC端<br>数据入库</div>
        <div class="flow-arrow">→</div>
        <div class="flow-item">Web页面<br>结果展示</div>
        <div class="flow-arrow">→</div>
        <div class="flow-item">巡检报告<br>自动生成</div>
    </div>
</div>

<div class="cards">
    <div class="card">
        <div class="number">{{ total_orders }}</div>
        <div>巡检任务数</div>
    </div>

    <div class="card">
        <div class="number">{{ finished_orders }}</div>
        <div>已完成任务</div>
    </div>

    <div class="card">
        <div class="number">{{ total_images }}</div>
        <div>巡检图片数</div>
    </div>

    <div class="card">
        <div class="number">{{ abnormal_count }}</div>
        <div>异常记录数</div>
    </div>
</div>

<div class="menu">
    <a href="/workorders_page">巡检任务管理</a>
    <a href="/records_page">巡检记录查看</a>
    <a href="/create_workorder">人工新建任务</a>
</div>

</body>
</html>
